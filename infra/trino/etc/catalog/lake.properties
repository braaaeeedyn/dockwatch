# Catalog `lake`: the same Iceberg REST catalog and SeaweedFS warehouse Spark uses, so lake.silver.station_status
# names the same table in both engines.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://dockwatch/warehouse/
iceberg.file-format=PARQUET
# Maintenance retention floor (plan decision 4); Trino's default 7d would do nothing on a days-old lake.
iceberg.expire-snapshots.min-retention=1d
iceberg.remove-orphan-files.min-retention=1d
fs.native-s3.enabled=true
s3.endpoint=http://s3:8333
s3.path-style-access=true
s3.region=${ENV:AWS_REGION}
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
