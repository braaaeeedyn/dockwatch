# Single-node Trino (M4a batch engine): the coordinator schedules work on itself.
# Memory: heap 1G (jvm.config), container mem_limit 2g. Per-node query memory + heap headroom stay <= the heap.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
query.max-memory=512MB
query.max-memory-per-node=512MB
memory.heap-headroom-per-node=256MB
# One small node: few threads, one writer per query (fewer, larger files from optimize)
task.concurrency=2
task.max-worker-threads=4
task.max-writer-count=1
