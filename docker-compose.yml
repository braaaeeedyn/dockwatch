# DockWatch local stack. Services are grouped into profiles so they fit in ~8 GB of Docker memory:
#   stream: Redpanda (+ Console), SeaweedFS (S3 API), Iceberg REST catalog, Postgres (ops DB with logical
#           replication, plus the iceberg_catalog database)
#   batch:  Trino, Airflow (+ its own airflow-db), on demand only (M4a; python tasks.py batch-up)
#   obs:    Marquez                   (added in M5)
# Start with: python tasks.py up stream

name: dockwatch

# Shared by airflow-scheduler / airflow-webserver / airflow-cli (M4a). Metadata lives in airflow-db, never ops-db:
# an always-writing scheduler there would make WAL the CDC slot dockwatch_ops has to retain.
x-airflow: &airflow
  build: infra/airflow
  image: dockwatch-airflow:2.11.2
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow-local-only@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__SECRET_KEY: dockwatch-local-only
    AIRFLOW__OPENLINEAGE__DISABLED: "true"
    AIRFLOW__LOGGING__LOGGING_CONFIG_CLASS: dockwatch.batch.airflow_logging.LOGGING_CONFIG
    PYTHONPATH: /opt/dockwatch/src
    DOCKWATCH_DATA_DIR: /opt/dockwatch/data
    DOCKWATCH_OPS_DB_DSN: postgresql://ops:ops-local-only@ops-db:5432/ops
    DOCKWATCH_TRINO_URL: http://trino:8080
    DOCKWATCH_CONNECT_URL: http://connect:8083
    DOCKWATCH_ALERTS_TOPIC_ARN: ${DOCKWATCH_ALERTS_TOPIC_ARN:-}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./src:/opt/dockwatch/src:ro
    - ./data:/opt/dockwatch/data
    # Only to list running containers (memory guard) and docker start / stop the existing `connect` container
    # (cdc_slot_keepalive). Never compose, never creates containers. Root-equivalent on the Docker VM: local only.
    - /var/run/docker.sock:/var/run/docker.sock
  mem_limit: 1g
  restart: "no"

services:
  redpanda:
    profiles: [stream]
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports: ["19092:19092", "18081:18081"]
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  console:
    profiles: [stream]
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8088:8080"]  # 8080 is often taken locally
    depends_on:
      redpanda: { condition: service_healthy }

  s3:
    # SeaweedFS with its S3 gateway stands in for S3 locally (MinIO's images are no longer published).
    # Credentials come from infra/seaweedfs/s3.json (local-only values, also in .env.example).
    profiles: [stream]
    image: chrislusf/seaweedfs:3.80
    command: server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    ports: ["8333:8333"]
    volumes:
      - s3:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  iceberg-rest:
    profiles: [stream]
    image: tabulario/iceberg-rest:1.6.0
    environment:
      # Catalog pointers live in Postgres (database iceberg_catalog on ops-db). The image's default in-memory SQLite
      # loses every table on restart, and a SQLite file fails concurrent streaming commits (SQLITE_BUSY).
      CATALOG_URI: jdbc:postgresql://ops-db:5432/iceberg_catalog
      CATALOG_JDBC_USER: ops
      CATALOG_JDBC_PASSWORD: ops-local-only
      CATALOG_WAREHOUSE: s3://dockwatch/warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://s3:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${DOCKWATCH_S3_ACCESS_KEY:-dockwatch}
      AWS_SECRET_ACCESS_KEY: ${DOCKWATCH_S3_SECRET_KEY:-dockwatch-local-only}
      AWS_REGION: ${DOCKWATCH_S3_REGION:-us-west-2}
    ports: ["8181:8181"]
    depends_on:
      s3: { condition: service_healthy }
      ops-db: { condition: service_healthy }

  ops-db:
    profiles: [stream]
    image: postgres:16-alpine
    # max_slot_wal_keep_size caps the WAL an idle slot can pin; past it the slot is lost (python tasks.py cdc-reset)
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4",
              "-c", "max_slot_wal_keep_size=1024MB"]
    environment:
      POSTGRES_DB: ops
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops-local-only
    ports: ["5434:5432"]  # 5432/5433 are often taken by other local projects
    volumes:
      - ops-db:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro  # also creates the iceberg_catalog database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 10s
      timeout: 5s
      retries: 10

  status-stream:
    # M2 streaming job. Separate profile so it only starts on purpose: python tasks.py stream (runs until
    # stream-stop) or python tasks.py catchup (processes the Kafka backlog with availableNow, then exits).
    profiles: [spark]
    build: infra/spark
    image: dockwatch-spark:3.5.5
    command: >
      /opt/spark/bin/spark-submit --master local[2] --driver-memory 1g
      --conf spark.sql.streaming.stateStore.providerClass=org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider
      /opt/dockwatch/src/dockwatch/streaming/status_stream.py
    environment:
      DOCKWATCH_TARGET: local
      DOCKWATCH_S3_BUCKET: dockwatch
      AWS_ACCESS_KEY_ID: ${DOCKWATCH_S3_ACCESS_KEY:-dockwatch}
      AWS_SECRET_ACCESS_KEY: ${DOCKWATCH_S3_SECRET_KEY:-dockwatch-local-only}
      AWS_REGION: ${DOCKWATCH_S3_REGION:-us-west-2}
    volumes:
      - ./src:/opt/dockwatch/src:ro
      - checkpoints:/checkpoints
    ports: ["4040:4040"]  # Spark UI
    mem_limit: 2g
    # Never restarted automatically: on this memory-tight host a stalled driver (heartbeat timeout, see DEVLOG
    # 2026-10-08) kept coming back and competing with other JVMs. Spark runs on demand only.
    restart: "no"

  connect:
    # M3 Kafka Connect + Debezium: Postgres ops.public.* changes -> Kafka topics ops.public.<table>.
    # Own profile (not `stream`) and on demand only (python tasks.py connect-up / cdc-e2e): it never runs beside a
    # Spark JVM on this memory-tight host (tasks.py refuses). The image tag is pinned in tasks.py CONNECT_IMAGE too.
    profiles: [cdc]
    image: quay.io/debezium/connect:2.7.3.Final
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: dockwatch-connect
      CONFIG_STORAGE_TOPIC: dockwatch-connect-configs
      OFFSET_STORAGE_TOPIC: dockwatch-connect-offsets
      STATUS_STORAGE_TOPIC: dockwatch-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_FLUSH_INTERVAL_MS: "5000"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["18083:8083"]
    mem_limit: 1g
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8083/connectors || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
    depends_on:
      redpanda: { condition: service_healthy }
      ops-db: { condition: service_healthy }

  cdc-apply:
    # M3 Spark apply: ops.public.* -> MERGE INTO lake.ops.* (availableNow, then exits). Only ever started with
    # `docker compose run` by python tasks.py cdc-catchup / cdc-reset / cdc-verify; not in the `spark` profile, so
    # `python tasks.py up spark` never starts two JVMs. Same image as status-stream (no new image).
    profiles: [cdc-apply]
    image: dockwatch-spark:3.5.5
    command: >
      /opt/spark/bin/spark-submit --master local[1] --driver-memory 1g
      --conf spark.sql.codegen.wholeStage=false
      /opt/dockwatch/src/dockwatch/cdc/apply.py
    environment:
      TZ: UTC  # collected timestamps are naive UTC (cdc/checksum.py)
      DOCKWATCH_TARGET: local
      DOCKWATCH_S3_BUCKET: dockwatch
      AWS_ACCESS_KEY_ID: ${DOCKWATCH_S3_ACCESS_KEY:-dockwatch}
      AWS_SECRET_ACCESS_KEY: ${DOCKWATCH_S3_SECRET_KEY:-dockwatch-local-only}
      AWS_REGION: ${DOCKWATCH_S3_REGION:-us-west-2}
    volumes:
      - ./src:/opt/dockwatch/src:ro
      - checkpoints:/checkpoints
    mem_limit: 2g
    restart: "no"

  trino:
    # M4a batch SQL engine (Iceberg maintenance, partition evolution; dbt-trino in M4b). Catalog `lake` =
    # the same Iceberg REST catalog and SeaweedFS warehouse as Spark (infra/trino/etc). On demand only
    # (python tasks.py batch-up / batch-stop); tasks refuse to run it beside Spark or Kafka Connect.
    # The image tag is pinned in tasks.py TRINO_IMAGE too.
    profiles: [batch]
    image: trinodb/trino:483
    environment:
      AWS_ACCESS_KEY_ID: ${DOCKWATCH_S3_ACCESS_KEY:-dockwatch}
      AWS_SECRET_ACCESS_KEY: ${DOCKWATCH_S3_SECRET_KEY:-dockwatch-local-only}
      AWS_REGION: ${DOCKWATCH_S3_REGION:-us-west-2}
    volumes:
      - ./infra/trino/etc:/etc/trino:ro
    ports: ["18080:8080"]
    # Heap 1G (jvm.config). 1536m was measured full (1532 MiB peak in iceberg_maintenance), so 2g per plan.md.
    mem_limit: 2g
    restart: "no"
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 5s
      retries: 36

  airflow-db:
    # Airflow's metadata database (M4a). Its own Postgres and volume, never ops-db (see x-airflow).
    profiles: [batch]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow-local-only
    volumes:
      - airflow-db:/var/lib/postgresql/data
    mem_limit: 256m
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 24

  airflow-scheduler:
    # Started only on purpose (python tasks.py scheduler-up); DAGs are paused at creation.
    <<: *airflow
    profiles: [batch]
    command: scheduler
    depends_on:
      airflow-db: { condition: service_healthy }

  airflow-webserver:
    # UI on http://localhost:18090; never started by the checks.
    <<: *airflow
    profiles: [batch]
    command: webserver
    environment:
      <<: *airflow-env
      AIRFLOW__WEBSERVER__WORKERS: "1"
    ports: ["18090:8080"]
    depends_on:
      airflow-db: { condition: service_healthy }

  airflow-cli:
    # One-shot Airflow CLI: python tasks.py airflow <args> / dag-test (docker compose run --rm --no-deps).
    <<: *airflow
    profiles: [airflow-cli]

volumes:
  checkpoints:
  redpanda:
  s3:
  ops-db:
  airflow-db:
